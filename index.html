<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./brasao_unidade.png">
    <title>CONTROLE GRANDES EVENTOS - COCB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        /* --- ESTILOS GERAIS --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #fff5f5; color: #333; }
        
        header {
            background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 100%);
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(183, 28, 28, 0.3);
            border-bottom: 4px solid #7f0000;
            display: flex; align-items: center; justify-content: space-between; text-align: center;
        }
        .header-logo { width: 85px; height: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); flex-shrink: 0; }
        .header-text { flex-grow: 1; padding: 0 20px; }
        .header-text h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .header-text p { margin-top: 5px; opacity: 0.9; font-size: 1.5rem; font-weight: 600; }
        @media (max-width: 700px) { header { flex-direction: column; gap: 15px; } }

        /* --- CONTROLES (AGORA COM 3 ITENS) --- */
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; background-color: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .search-box { flex: 2; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; transition: all 0.3s; min-width: 200px; }
        
        /* Estilo para os DOIS selects (Data e Situação) */
        .filter-select { 
            flex: 1; 
            padding: 12px 15px; 
            border: 2px solid #e0e0e0; 
            border-radius: 6px; 
            font-size: 1rem; 
            background-color: white; 
            cursor: pointer; 
            min-width: 180px; 
            font-weight: 600; 
            color: #b71c1c; 
        }

        .search-box:focus, .filter-select:focus { border-color: #d32f2f; outline: none; box-shadow: 0 0 5px rgba(211, 47, 47, 0.3); }
        #loading { color: #c0392b; font-weight: 700; display: none; font-size: 0.9rem; }

        .table-container { overflow-x: auto; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); background-color: #fff; border-radius: 8px; height: 65vh; overflow-y: auto; border: 1px solid #ffcdd2; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ffebee; font-size: 0.9rem; }
        th { background-color: #8b0000; color: #ffffff; position: sticky; top: 0; z-index: 10; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; border-right: 1px solid #a50000; }
        tr:nth-child(even) { background-color: #fffafa; }
        tr:hover { background-color: #ffebee; transition: background-color 0.2s; }
        footer { text-align: center; margin-top: 30px; font-size: 0.85rem; color: #b71c1c; font-weight: 600; }

        .tag { padding: 4px 8px; border-radius: 4px; font-weight: 700; color: white; display: inline-block; font-size: 0.85rem; text-transform: uppercase; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        /* Coluna de Numeração */
        th:first-child, td:first-child { width: 40px; text-align: center; font-weight: bold; color: #7f8c8d; background-color: #fdfdfd; }
        th:first-child { background-color: #640000; color: #fff; }
    </style>
</head>
<body>

    <header>
        <img src="./brasao.png" alt="Brasão CBMMA" class="header-logo">
        <div class="header-text">
            <h1>COMANDO OPERACIONAL METROPOLITANO</h1>
            <p>Controle de serviços em Grandes Eventos</p>
        </div>
        <img src="./brasao_unidade.png" onerror="this.style.opacity='0'" alt="Brasão Unidade" class="header-logo">
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Pesquisar Militar, Posto ou Unidade...">
        
        <select id="statusFilter" class="filter-select">
            <option value="">🔰 Todas as Situações</option>
        </select>

        <select id="columnFilter" class="filter-select">
            <option value="">📅 Filtrar por Data...</option>
        </select>
        
        <span id="loading">🚒 Carregando...</span>
    </div>

    <div class="table-container">
        <table id="militaresTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <footer>&copy; 2026 CBMMA - Criado por Igor Moreira Pontes</footer>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdla33q3_rNMm8KTn518RipwwkZvv60sOMk79_tU2twWCAkV-cxHKvEoLJVV7sqw/pub?output=csv";
        
        // --- CONFIGURAÇÃO: NOME DA COLUNA DE SITUAÇÃO NA PLANILHA ---
        // Se na sua planilha estiver "Status", "Obs" ou "Estado", mude aqui dentro das aspas:
        const COLUNA_SITUACAO = "SITUAÇÃO"; 
        // -----------------------------------------------------------

        const tableHeader = document.getElementById("tableHeader");
        const tableBody = document.getElementById("tableBody");
        const loadingMsg = document.getElementById("loading");
        const searchInput = document.getElementById("searchInput");
        const columnFilter = document.getElementById("columnFilter");
        const statusFilter = document.getElementById("statusFilter"); // Novo Elemento
        
        let dadosCompletos = [];

        function carregarDados() {
            loadingMsg.style.display = "block";
            Papa.parse(sheetUrl, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    dadosCompletos = results.data;
                    preencherFiltroDatas(dadosCompletos);
                    preencherFiltroSituacao(dadosCompletos); // Chama a nova função
                    gerarTabela(dadosCompletos, "", "");
                    loadingMsg.style.display = "none";
                },
                error: function(err) { console.error(err); loadingMsg.innerHTML = "❌ Erro."; }
            });
        }

        function preencherFiltroDatas(dados) {
            if (dados.length === 0) return;
            const colunas = Object.keys(dados[0]);
            columnFilter.innerHTML = '<option value="">📅 Todos os Dias (Visão Geral)</option>';
            colunas.forEach(coluna => {
                if (coluna.includes("/") && /[0-9]/.test(coluna)) { 
                    const option = document.createElement("option");
                    option.value = coluna;
                    option.textContent = coluna;
                    columnFilter.appendChild(option);
                }
            });
        }

        // --- NOVA FUNÇÃO: PREENCHE O FILTRO DE SITUAÇÃO ---
        function preencherFiltroSituacao(dados) {
            if (dados.length === 0) return;

            // 1. Pega todos os valores da coluna SITUAÇÃO
            const todasSituacoes = dados.map(item => item[COLUNA_SITUACAO]).filter(val => val); // .filter remove vazios
            
            // 2. Remove duplicados (cria uma lista única)
            const situacoesUnicas = [...new Set(todasSituacoes)].sort();

            statusFilter.innerHTML = '<option value="">🔰 Todas as Situações</option>';

            situacoesUnicas.forEach(sit => {
                if(sit.trim() !== "") { // Só adiciona se não for texto vazio
                    const option = document.createElement("option");
                    option.value = sit;
                    option.textContent = sit;
                    statusFilter.appendChild(option);
                }
            });
        }

        function aplicarFiltros() {
            const termoTexto = searchInput.value.toLowerCase();
            const colunaSelecionada = columnFilter.value;
            const statusSelecionado = statusFilter.value; // Pega o valor do novo filtro

            const dadosFiltrados = dadosCompletos.filter(item => {
                // Filtro 1: Texto (Busca Geral)
                const matchTexto = Object.values(item).some(val => String(val).toLowerCase().includes(termoTexto));
                
                // Filtro 2: Coluna de Data (Se tem serviço naquele dia)
                let matchColuna = true;
                if (colunaSelecionada !== "") {
                    const valorNaCélula = item[colunaSelecionada];
                    matchColuna = valorNaCélula && valorNaCélula.trim() !== "";
                }

                // Filtro 3: Situação (Pronto, Férias, etc.)
                let matchSituacao = true;
                if (statusSelecionado !== "") {
                    // Verifica se a coluna "SITUAÇÃO" é igual ao que foi escolhido no filtro
                    matchSituacao = item[COLUNA_SITUACAO] === statusSelecionado;
                }

                // Só passa se atender aos 3 requisitos
                return matchTexto && matchColuna && matchSituacao;
            });
            
            gerarTabela(dadosFiltrados, colunaSelecionada, termoTexto);
        }

        function obterCorPorTexto(texto) {
            if (!texto) return null;
            const txt = String(texto).trim().toLowerCase();

            if (txt.endsWith("prestado")) return "#27ae60"; 
            if (txt.includes("voluntário") || txt.includes("voluntario")) return "#2980b9";
            if (txt.endsWith("falta sem justificativa")) return "#000000";
            if (txt.endsWith("falta justificada")) return "#c0392b";
            
            // Opcional: Pintar a situação de "Pronto" de verde claro ou algo assim?
            if (txt === "pronto") return "#16a085";

            return null;
        }

        function gerarTabela(dados, diaSelecionado, termoBusca) {
            tableHeader.innerHTML = "";
            tableBody.innerHTML = "";

            if (dados.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100%" style="text-align:center; padding: 20px; color: #b71c1c;">Nenhum militar encontrado com esses filtros.</td></tr>';
                return;
            }

            const todasColunas = Object.keys(dados[0]);
            const colunasParaMostrar = [];

            const thNum = document.createElement("th");
            thNum.textContent = "#";
            tableHeader.appendChild(thNum);

            todasColunas.forEach(col => {
                const ehData = col.includes("/") && /[0-9]/.test(col);
                const ehUnidadeExtra = col.toLowerCase().includes("secundária") || col.toLowerCase().includes("terciária");

                if (diaSelecionado !== "") {
                    if (col === diaSelecionado) colunasParaMostrar.push(col);
                    else if (!ehData && !ehUnidadeExtra) colunasParaMostrar.push(col);
                    return;
                }
                if (termoBusca !== "" && termoBusca.length > 0) {
                    if (!ehData) {
                        if (!ehUnidadeExtra) colunasParaMostrar.push(col);
                    } else {
                        const temServicoNesseDia = dados.some(militar => militar[col] && militar[col].trim() !== "");
                        if (temServicoNesseDia) colunasParaMostrar.push(col);
                    }
                    return;
                }
                colunasParaMostrar.push(col);
            });

            colunasParaMostrar.forEach(coluna => {
                const th = document.createElement("th");
                th.textContent = coluna;
                tableHeader.appendChild(th);
            });

            dados.forEach((linha, index) => {
                const tr = document.createElement("tr");

                const tdNum = document.createElement("td");
                tdNum.textContent = index + 1;
                tr.appendChild(tdNum);

                colunasParaMostrar.forEach(coluna => {
                    const td = document.createElement("td");
                    const valor = linha[coluna];
                    const cor = obterCorPorTexto(valor);

                    if (cor) {
                        const tag = document.createElement("span");
                        tag.className = "tag";
                        tag.style.backgroundColor = cor;
                        tag.textContent = valor;
                        td.appendChild(tag);
                    } else {
                        td.textContent = valor;
                    }

                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }

        searchInput.addEventListener("keyup", aplicarFiltros);
        columnFilter.addEventListener("change", aplicarFiltros);
        statusFilter.addEventListener("change", aplicarFiltros); // Escuta mudanças no novo filtro
        carregarDados();
    </script>
</body>
</html>
