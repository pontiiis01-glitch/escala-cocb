<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./brasao_unidade.png">
    <title>Escala CBMMA - COCB-M</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        /* --- ESTILOS GERAIS --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #fff5f5; color: #333; }
        
        header {
            background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 100%);
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(183, 28, 28, 0.3);
            border-bottom: 4px solid #7f0000;
            display: flex; align-items: center; justify-content: space-between; text-align: center;
        }
        .header-logo { width: 85px; height: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); flex-shrink: 0; }
        .header-text { flex-grow: 1; padding: 0 20px; }
        .header-text h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .header-text p { margin-top: 5px; opacity: 0.9; font-size: 1.5rem; font-weight: 600; }
        @media (max-width: 700px) { header { flex-direction: column; gap: 15px; } }

        /* --- CONTROLES --- */
        .controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; background-color: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .search-box { flex: 2; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; transition: all 0.3s; min-width: 200px; }
        .filter-select { flex: 1; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1rem; background-color: white; cursor: pointer; min-width: 160px; font-weight: 600; color: #b71c1c; }
        .search-box:focus, .filter-select:focus { border-color: #d32f2f; outline: none; box-shadow: 0 0 5px rgba(211, 47, 47, 0.3); }
        #loading { color: #c0392b; font-weight: 700; display: none; font-size: 0.9rem; }

        /* --- NOVO: PLACAR DE ESTATÍSTICAS --- */
        #statsPanel {
            display: none; /* Começa escondido */
            margin-bottom: 20px;
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #b71c1c;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s;
        }

        .stats-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-card {
            background-color: #ffebee;
            padding: 10px 20px;
            border-radius: 6px;
            text-align: center;
            min-width: 100px;
            border: 1px solid #ffcdd2;
        }

        .stat-number { font-size: 1.5rem; font-weight: 800; color: #b71c1c; display: block; }
        .stat-label { font-size: 0.85rem; color: #555; font-weight: 600; text-transform: uppercase; }
        
        .stat-card.total { background-color: #b71c1c; color: white; border: none; }
        .stat-card.total .stat-number { color: white; }
        .stat-card.total .stat-label { color: #ffcdd2; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- TABELA --- */
        .table-container { overflow-x: auto; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); background-color: #fff; border-radius: 8px; height: 65vh; overflow-y: auto; border: 1px solid #ffcdd2; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ffebee; font-size: 0.9rem; }
        th { background-color: #8b0000; color: #ffffff; position: sticky; top: 0; z-index: 10; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; border-right: 1px solid #a50000; }
        tr:nth-child(even) { background-color: #fffafa; }
        tr:hover { background-color: #ffebee; transition: background-color 0.2s; }
        footer { text-align: center; margin-top: 30px; font-size: 0.85rem; color: #b71c1c; font-weight: 600; }

        .tag { padding: 4px 8px; border-radius: 4px; font-weight: 700; color: white; display: inline-block; font-size: 0.85rem; text-transform: uppercase; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        th:first-child, td:first-child { width: 40px; text-align: center; font-weight: bold; color: #7f8c8d; background-color: #fdfdfd; }
        th:first-child { background-color: #640000; color: #fff; }
    </style>
</head>
<body>

    <header>
        <img src="./brasao.png" alt="Brasão CBMMA" class="header-logo">
        <div class="header-text">
            <h1>COMANDO OPERACIONAL METROPOLITANO</h1>
            <p>Controle de serviços em Grandes Eventos</p>
        </div>
        <img src="./brasao_unidade.png" onerror="this.style.opacity='0'" alt="Brasão Unidade" class="header-logo">
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Pesquisar Militar, Posto ou Unidade...">
        <select id="statusFilter" class="filter-select">
            <option value="">🔰 Todas as Situações</option>
        </select>
        <select id="yearFilter" class="filter-select">
            <option value="">📅 Ano...</option>
        </select>
        <select id="columnFilter" class="filter-select">
            <option value="">📆 Escolha o Ano Primeiro</option>
        </select>
        <span id="loading">🚒 Carregando...</span>
    </div>

    <div id="statsPanel">
        <div class="stats-grid" id="statsContent">
            </div>
    </div>

    <div class="table-container">
        <table id="militaresTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <footer>&copy; 2026 CBMMA - Criado por Igor Moreira Pontes</footer>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdla33q3_rNMm8KTn518RipwwkZvv60sOMk79_tU2twWCAkV-cxHKvEoLJVV7sqw/pub?output=csv";
        const COLUNA_SITUACAO = "SITUAÇÃO"; 

        const tableHeader = document.getElementById("tableHeader");
        const tableBody = document.getElementById("tableBody");
        const loadingMsg = document.getElementById("loading");
        const searchInput = document.getElementById("searchInput");
        const statusFilter = document.getElementById("statusFilter");
        const yearFilter = document.getElementById("yearFilter");
        const columnFilter = document.getElementById("columnFilter");
        const statsPanel = document.getElementById("statsPanel");
        const statsContent = document.getElementById("statsContent");
        
        let dadosCompletos = [];
        let colunasDeData = []; 

        function carregarDados() {
            loadingMsg.style.display = "block";
            Papa.parse(sheetUrl, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    dadosCompletos = results.data;
                    colunasDeData = Object.keys(dadosCompletos[0]).filter(col => col.includes("/") && /[0-9]/.test(col));
                    preencherFiltroSituacao(dadosCompletos);
                    preencherFiltroAnos(); 
                    gerarTabela(dadosCompletos, "", "", ""); 
                    loadingMsg.style.display = "none";
                },
                error: function(err) { console.error(err); loadingMsg.innerHTML = "❌ Erro."; }
            });
        }

        function preencherFiltroAnos() {
            const anosUnicos = new Set();
            colunasDeData.forEach(dataStr => {
                const match = dataStr.match(/\d{4}/);
                if (match) anosUnicos.add(match[0]);
                else anosUnicos.add("Outros");
            });
            const anosOrdenados = Array.from(anosUnicos).sort();
            yearFilter.innerHTML = '<option value="">📅 Ano...</option>';
            anosOrdenados.forEach(ano => {
                const option = document.createElement("option");
                option.value = ano;
                option.textContent = "Ano " + ano;
                yearFilter.appendChild(option);
            });
        }

        function atualizarListaDias() {
            const anoSelecionado = yearFilter.value;
            columnFilter.innerHTML = '';

            if (anoSelecionado === "") {
                const opt = document.createElement("option");
                opt.textContent = "📆 Escolha o Ano Primeiro";
                columnFilter.appendChild(opt);
                columnFilter.disabled = true;
                aplicarFiltros(); 
                return;
            }

            columnFilter.disabled = false;
            const optVazio = document.createElement("option");
            optVazio.value = "";
            optVazio.textContent = "Selecione o dia...";
            columnFilter.appendChild(optVazio);

            const optTodos = document.createElement("option");
            optTodos.value = "TODOS_ANO";
            optTodos.textContent = "👀 Ver todos de " + anoSelecionado;
            optTodos.style.fontWeight = "bold";
            columnFilter.appendChild(optTodos);

            colunasDeData.forEach(dataStr => {
                if (dataStr.includes(anoSelecionado) || (anoSelecionado === "Outros" && !/\d{4}/.test(dataStr))) {
                    const option = document.createElement("option");
                    option.value = dataStr;
                    option.textContent = dataStr;
                    columnFilter.appendChild(option);
                }
            });
            aplicarFiltros(); 
        }

        function preencherFiltroSituacao(dados) {
            if (dados.length === 0) return;
            const todasSituacoes = dados.map(item => item[COLUNA_SITUACAO]).filter(val => val);
            const situacoesUnicas = [...new Set(todasSituacoes)].sort();
            statusFilter.innerHTML = '<option value="">🔰 Todas as Situações</option>';
            situacoesUnicas.forEach(sit => {
                if(sit.trim() !== "") {
                    const option = document.createElement("option");
                    option.value = sit;
                    option.textContent = sit;
                    statusFilter.appendChild(option);
                }
            });
        }

        function aplicarFiltros() {
            const termoTexto = searchInput.value.toLowerCase();
            const anoSelecionado = yearFilter.value;
            const diaSelecionado = columnFilter.value;
            const statusSelecionado = statusFilter.value;

            const dadosFiltrados = dadosCompletos.filter(item => {
                const matchTexto = Object.values(item).some(val => String(val).toLowerCase().includes(termoTexto));
                
                let matchColuna = true;
                if (diaSelecionado !== "" && diaSelecionado !== "TODOS_ANO") {
                    const valorNaCélula = item[diaSelecionado];
                    matchColuna = valorNaCélula && valorNaCélula.trim() !== "";
                }

                let matchSituacao = true;
                if (statusSelecionado !== "") {
                    matchSituacao = item[COLUNA_SITUACAO] === statusSelecionado;
                }

                return matchTexto && matchColuna && matchSituacao;
            });
            
            // ATUALIZA O PLACAR COM OS DADOS FILTRADOS
            calcularEstatisticas(dadosFiltrados);

            gerarTabela(dadosFiltrados, diaSelecionado, anoSelecionado, termoTexto);
        }

        // --- NOVA FUNÇÃO: CALCULA SERVIÇOS TOTAIS E POR ANO ---
        function calcularEstatisticas(dados) {
            // Se não tiver dados ou estiver mostrando muita gente (>10), esconde o placar
            if (dados.length === 0 || dados.length > 20) {
                statsPanel.style.display = "none";
                return;
            }

            statsPanel.style.display = "block";
            let totalGeral = 0;
            let servicosPorAno = {}; // Objeto para guardar { "2025": 10, "2026": 5 }

            // Percorre cada militar filtrado
            dados.forEach(militar => {
                // Percorre TODAS as colunas de data (independente do filtro visual)
                colunasDeData.forEach(colData => {
                    const valor = militar[colData];
                    // Se tiver algo escrito na célula (não for vazio)
                    if (valor && valor.trim() !== "") {
                        totalGeral++;
                        
                        // Descobre o ano dessa coluna
                        const matchAno = colData.match(/\d{4}/);
                        const ano = matchAno ? matchAno[0] : "Outros";

                        if (!servicosPorAno[ano]) servicosPorAno[ano] = 0;
                        servicosPorAno[ano]++;
                    }
                });
            });

            // GERA O HTML DOS CARDS
            let html = `
                <div class="stat-card total">
                    <span class="stat-number">${totalGeral}</span>
                    <span class="stat-label">Total Geral</span>
                </div>
            `;

            // Ordena os anos para exibir bonito (2025, 2026...)
            Object.keys(servicosPorAno).sort().forEach(ano => {
                html += `
                    <div class="stat-card">
                        <span class="stat-number">${servicosPorAno[ano]}</span>
                        <span class="stat-label">Ano ${ano}</span>
                    </div>
                `;
            });

            statsContent.innerHTML = html;
        }

        function obterCorPorTexto(texto) {
            if (!texto) return null;
            const txt = String(texto).trim().toLowerCase();
            if (txt.endsWith("prestado")) return "#27ae60"; 
            if (txt.includes("voluntário") || txt.includes("voluntario")) return "#2980b9";
            if (txt.endsWith("falta sem justificativa")) return "#000000";
            if (txt.endsWith("falta justificada")) return "#c0392b";
            if (txt === "pronto") return "#16a085";
            return null;
        }

        function formatarNomeGuerra(texto) {
            if (!texto) return "";
            return texto.replace(/\*(.*?)\*/g, '<b style="color: #b71c1c; font-weight: 900;">$1</b>');
        }

        function gerarTabela(dados, diaSelecionado, anoSelecionado, termoBusca) {
            tableHeader.innerHTML = "";
            tableBody.innerHTML = "";

            if (dados.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="100%" style="text-align:center; padding: 20px; color: #b71c1c;">Nenhum militar encontrado com esses filtros.</td></tr>';
                return;
            }

            const todasColunas = Object.keys(dados[0]);
            const colunasParaMostrar = [];
            const thNum = document.createElement("th");
            thNum.textContent = "#";
            tableHeader.appendChild(thNum);

            todasColunas.forEach(col => {
                const ehData = col.includes("/") && /[0-9]/.test(col);
                const ehUnidadeExtra = col.toLowerCase().includes("secundária") || col.toLowerCase().includes("terciária");

                // REGRA 1: BUSCA POR NOME
                // Se o usuário selecionou UM ANO, respeita o ano mesmo na busca
                // Se NÃO selecionou ano, aí mostra tudo.
                if (termoBusca !== "" && termoBusca.length > 0) {
                    
                    // Se o usuário está filtrando por ano (ex: 2025), mostra só as datas de 2025
                    if (anoSelecionado !== "") {
                        if (ehData && !col.includes(anoSelecionado)) return; // Pula anos errados
                    }

                    if (!ehData) {
                        if (!ehUnidadeExtra) colunasParaMostrar.push(col);
                    } else {
                        // Mostra a data se tiver serviço
                        const temServicoNesseDia = dados.some(militar => militar[col] && militar[col].trim() !== "");
                        if (temServicoNesseDia) colunasParaMostrar.push(col);
                    }
                    return; 
                }

                // REGRA 2: SEM BUSCA POR NOME (Comportamento Padrão)
                if (anoSelecionado === "" || diaSelecionado === "") {
                    if (!ehData && !ehUnidadeExtra) colunasParaMostrar.push(col);
                    return;
                }

                if (diaSelecionado === "TODOS_ANO") {
                    if (!ehData && !ehUnidadeExtra) {
                        colunasParaMostrar.push(col);
                        return;
                    }
                    if (ehData && col.includes(anoSelecionado)) {
                        colunasParaMostrar.push(col);
                    }
                    return;
                }

                if (col === diaSelecionado) colunasParaMostrar.push(col);
                else if (!ehData && !ehUnidadeExtra) colunasParaMostrar.push(col);
            });

            colunasParaMostrar.forEach(coluna => {
                const th = document.createElement("th");
                th.textContent = coluna;
                tableHeader.appendChild(th);
            });

            dados.forEach((linha, index) => {
                const tr = document.createElement("tr");
                const tdNum = document.createElement("td");
                tdNum.textContent = index + 1;
                tr.appendChild(tdNum);

                colunasParaMostrar.forEach(coluna => {
                    const td = document.createElement("td");
                    const valorOriginal = linha[coluna] || "";
                    const cor = obterCorPorTexto(valorOriginal);

                    if (cor) {
                        const tag = document.createElement("span");
                        tag.className = "tag";
                        tag.style.backgroundColor = cor;
                        tag.innerHTML = formatarNomeGuerra(valorOriginal);
                        td.appendChild(tag);
                    } else {
                        td.innerHTML = formatarNomeGuerra(valorOriginal);
                    }
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }

        searchInput.addEventListener("keyup", aplicarFiltros);
        statusFilter.addEventListener("change", aplicarFiltros); 
        yearFilter.addEventListener("change", atualizarListaDias); 
        columnFilter.addEventListener("change", aplicarFiltros);   

        carregarDados();
    </script>
</body>
</html>
